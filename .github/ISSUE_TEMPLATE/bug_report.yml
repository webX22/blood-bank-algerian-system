name: Bug report
description: Report a reproducible problem in the application or documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data only. Do not include patient/donor information, credentials, tokens, or production secrets. For a security vulnerability, follow [SECURITY.md](https://github.com/webX22/blood-bank-algerian-system/blob/main/SECURITY.md) and report it privately.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence using synthetic data.
      placeholder: "1. Start the API...\n2. Open the portal...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Provide a commit SHA or release tag if known.
  - type: dropdown
    id: component
    attributes:
      label: Affected area
      options:
        - Laravel API
        - Web portal
        - Database or migrations
        - Documentation or setup
        - Accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Include OS, browser/runtime versions, and redacted error logs. Remove names, emails, IPs, tokens, and health information.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and privacy
      options:
        - label: I used synthetic data and removed personal information, credentials, and secrets.
          required: true
        - label: This report does not disclose a security vulnerability; if it does, I will use the private reporting process.
          required: true
